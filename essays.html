                <p>下雨天的清水寺少了一些喧嚣。雨水让石板路的纹理变得格外清晰，青苔在微弱的光线下泛着幽幽的绿。躲在屋檐下听雨声，忽然明白了一些所谓的“物哀”之美。</p>
                <p>那些在晴天里被忽略的建筑暗部，在阴雨天反而呈现出极具层次的炭黑色。撑着伞的行人匆匆走过，水花溅起的一瞬间被快门定格。在这一刻，文字和画面达成了和解。</p>
