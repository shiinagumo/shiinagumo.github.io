<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人空间</title>
    <!-- 引入 Tailwind CSS 带来现代感的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fcfbf9] text-[#2c2c2c] antialiased selection:bg-stone-200">

    <!-- 导航栏 -->
    <nav class="max-w-6xl mx-auto px-6 py-8 flex justify-between items-center">
        <a href="index.html" class="text-xl font-medium tracking-widest uppercase">个人站</a>
        <div class="space-x-8 text-sm tracking-wider font-light">
            <a href="photography.html" class="hover:text-stone-500 transition-colors">照片</a>
            <a href="essays.html" class="hover:text-stone-500 transition-colors">随笔</a>
        </div>
    </nav>

    <!-- 英雄首屏 (Hero Section) -->
    <header class="max-w-6xl mx-auto px-6 py-12 md:py-20">
        <div class="max-w-2xl">
            <h1 class="text-3xl md:text-4xl font-serif font-light leading-relaxed mb-6">
                用镜头捕捉转瞬即逝的光线，<br>用文字留住不可复制的瞬间。
            </h1>
            <p class="text-stone-500 text-sm font-light tracking-wide leading-7">
                欢迎来到我的个人角落。
            </p>
        </div>
    </header>

    <!-- 精选展示区域 -->
    <main class="max-w-6xl mx-auto px-6 pb-24">
        <h2 class="text-xs uppercase tracking-widest text-stone-400 font-medium mb-8">精选更新 / Featured</h2>
        
        <!-- 图文混合网格布局 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- 摄影卡片 1（改为替换后的本地照片1） -->
            <div class="md:col-span-2 group cursor-pointer overflow-hidden" onclick="openLightbox('images/photo1.jpg')">
                <div class="overflow-hidden bg-stone-100 aspect-[16/10]">
                    <img src="images/photo1.jpg" alt="京都" 
                         class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-700 ease-out">
                </div>
                <div class="mt-4 flex justify-between items-baseline">
                    <h3 class="text-sm font-light tracking-wide">清水寺</h3>
                    <span class="text-xs text-stone-400 font-serif italic">2026 / 地点</span>
                </div>
            </div>

            <!-- 随笔卡片 1 -->
            <div class="bg-stone-50 p-8 flex flex-col justify-between border border-stone-100 aspect-square md:aspect-auto">
                <div>
                    <span class="text-xs text-stone-400 tracking-wider">随笔 / 2026.07</span>
                    <h3 class="text-lg font-serif font-light my-4 leading-normal hover:text-stone-500">
                        <a href="essays.html">京都的雨，落在石板路上</a>
                    </h3>
                    <p class="text-stone-500 text-xs font-light leading-relaxed line-clamp-4">
                        下雨天的清水寺少了一些喧嚣。雨水让石板路的纹理变得格外清晰，青苔在微弱的光线下泛着幽幽的绿。躲在屋檐下听雨声，忽然明白了一些所谓的“物哀”之美……
                    </p>
                </div>
                <a href="essays.html" class="text-xs tracking-widest uppercase font-light text-stone-400 hover:text-stone-600 mt-4 inline-block">Read More →</a>
            </div>

            <!-- 随笔卡片 2 -->
            <div class="bg-stone-50 p-8 flex flex-col justify-between border border-stone-100 aspect-square md:aspect-auto">
                <div>
                    <span class="text-xs text-stone-400 tracking-wider">随笔 / 2026.07</span>
                    <h3 class="text-lg font-serif font-light my-4 leading-normal hover:text-stone-500">
                        <a href="essays.html"></a>
                    </h3>
                    <p class="text-stone-500 text-xs font-light leading-relaxed line-clamp-4">
                       关西七天六晚路线
                    </p>
                </div>
                <a href="essays.html" class="text-xs tracking-widest uppercase font-light text-stone-400 hover:text-stone-600 mt-4 inline-block">Read More →</a>
            </div>

            <!-- 摄影卡片 2（改为替换后的本地照片2） -->
            <div class="md:col-span-2 group cursor-pointer overflow-hidden" onclick="openLightbox('images/photo2.jpg')">
                <div class="overflow-hidden bg-stone-100 aspect-[16/10]">
                    <img src="images/photo2.jpg" alt="大阪" 
                         class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-700 ease-out">
                </div>
                <div class="mt-4 flex justify-between items-baseline">
                    <h3 class="text-sm font-light tracking-wide">关西</h3>
                    <span class="text-xs text-stone-400 font-serif italic">2026 / 大阪</span>
                </div>
            </div>

        </div>
    </main>

    <!-- 全局图片灯箱弹窗组件 -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="大图" class="max-w-full max-h-[90vh] object-contain select-none">
    </div>

    <!-- 页脚 -->
    <footer class="border-t border-stone-100 text-center py-8 text-xs text-stone-400 font-light tracking-widest">
        © 2026  All Rights Reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
